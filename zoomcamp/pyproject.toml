[project]
name = "zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shreya Parkar", email = "136149556+ShreyaCtrl@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy>=2.1.3",
    "tqdm>=4.70.1",
]

[project.scripts]
zoomcamp = "zoomcamp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]

[tool.uv]
package = false